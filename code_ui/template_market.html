    + ((O.japan || {}).n_rows || jpN) + (doc ? doc.n_docs : 0);

  /* ── dải số trên cùng ── */
  const hero = `<div class="ovhero">
    <div><div class="lb">Tổng số bản ghi</div>
      <div class="big">${num(totalRows)}</div>
      <div class="sub">cộng số dòng của <b>ba kho tách bạch</b> — chưa ráp vào nhau,

    <div><div class="lb">Toà nhà</div>
      <div class="big">${num((C.loose || 0) + jpN)}</div>
      <div class="sub">${num(nMarket + (jpN ? 1 : 0))} thị trường · ${num(C.strict)} toà
        đủ sáu trường lõi (${num(C.strict_pct, 1)}%)</div></div>
    ${doc ? `<div><div class="lb">Tài liệu</div>
      <div class="big">${num(doc.n_docs)}</div>
      <div class="sub">${num(doc.mb)} MB chữ · ${num(doc.n_domains)} nguồn web
        · ${num(doc.n_langs)} ngôn ngữ</div></div>` : ""}
  </div>`;

  /* ── ba khối, cột trái ── */
  const bVN = ovBlock({
    title: "Thị trường Việt Nam", cnt: "bốn cấp",
    big: tier("Dự án"), unit: "dự án",
    desc: `Kho duy nhất đi đủ <b>bốn cấp</b> — dự án → toà → căn → tin rao — và là kho duy nhất
      có toạ độ thật cho gần như mọi dự án.`,
    stats: [["toà nhà", tier("Toà nhà")], ["căn hộ", tier("Căn hộ")],
            ["tin rao", tier("Tin rao")], ["tỉnh thành", O.vn_provinces || 0]],
    foot: `Nằm riêng một họ bảng, <b>chưa ráp vào corpus thế giới</b> nên không có mặt trong
      con số sáu trường lõi.`,
  });
  const bWorld = ovBlock({
    title: "Thị trường thế giới", cnt: `${num(nMarket + (jpN ? 1 : 0))} thị trường`,
    big: (C.loose || 0) + jpN, unit: "toà nhà",
    desc: `${num(nMarket)} thị trường trong corpus, cộng <b>${num(jpN)} toà Nhật Bản</b> dựng tay
      trong repo — Nhật chi tiết hơn hẳn nhưng chưa qua đường ống hợp nhất.`,
    stats: [["dự án / khu", t.dim_project || 0], ["đủ sáu trường lõi", C.strict || 0],
            ["toà Nhật", jpN]],
    foot: `Sáu trường lõi là <b>cơ cấu căn · diện tích · giá · tiện ích · phong cách · bàn giao</b> —
      đủ cả sáu thì đem hai toà ra so trực tiếp được. Nhật đếm riêng vì chưa hợp nhất.`,
  });
  const bDoc = doc ? ovBlock({
    title: doc.label, cnt: `${num(doc.n_jobs)} đợt thu thập`,
    big: doc.n_docs, unit: "tài liệu",
    desc: `Dữ liệu dạng <b>chữ</b>, không phải bảng số: bài báo, hồ sơ, trang bách khoa về
      bất động sản, gom từ ${num(doc.n_domains)} nguồn web.`,
    stats: [["MB chữ", doc.mb], ["nguồn web", doc.n_domains],
            ["ngôn ngữ", doc.n_langs], ["có URL gốc", doc.with_url]],
    foot: doc.roots.map(r => `<b>${num(r.n)}</b> ${esc(r.k)}`).join(" · ") + ".",
  }) : "";

  box.innerHTML = hero + `
    <div class="ovmain">
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">${bVN}${bWorld}${bDoc}</div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        ${ovMap(O)}
        ${ovBars("Toà theo thị trường", `${num(nMarket)} thị trường`,
          (C.by_market || []).map(m => ({ k: m.k, n: m.n })), "toà", "",
          "Thang tuyến tính. Bấm tab <b>Thị trường</b> để mở từng cái.")}
        ${doc ? ovBars(`Tài liệu theo nguồn`, `${num(doc.n_domains)} nguồn`, doc.domains, "", "",
          "Bách khoa toàn thư bốn thứ tiếng chiếm phần lớn nhóm đầu — đáng biết trước khi dùng làm nền tri thức.") : ""}
      </div>
    </div>`;

  box.querySelectorAll(".wpt").forEach(g => g.onclick = () => {
    const s2 = g.dataset.slug;
    selMarket.value = s2; setView("market", true);
  });
}

/* ---------- chuyển trang ---------- */
let VIEW = "market";
async function setView(v, push) {
  VIEW = v === "overview" ? "overview" : "market";
  document.getElementById("view-overview").hidden = VIEW !== "overview";
  document.getElementById("view-market").hidden = VIEW === "overview";
  document.querySelector(".filterbar").hidden = VIEW === "overview";
  document.getElementById("q").style.display = VIEW === "overview" ? "none" : "";
  document.querySelectorAll("#nav button").forEach(b =>
    b.classList.toggle("on", b.dataset.view === VIEW));
  if (VIEW === "overview") {
    document.getElementById("sub").textContent = "· tổng quan ba nguồn";
    document.title = "Tổng quan — Benchmark toà nhà";
    renderOverview();
  } else {
    loadMarket(selMarket.value);
  }
  if (push) { try { history.replaceState(null, "", VIEW === "overview" ? "#tong-quan" : "#" + selMarket.value); } catch (e) {} }
}
document.querySelectorAll("#nav button").forEach(b =>
  b.onclick = () => setView(b.dataset.view, true));

let KNOWN = new Set();

async function boot() {
  let order;
  if (ONLINE) {
    try {
      const [mk, en] = await Promise.all([get("markets"), get("enums")]);
      E_LIVE = en.enums || {};
      selMarket.innerHTML = mk.rows.map(marketOption).join("");
      order = mk.rows.map(m => m.market);
    } catch (e) { return fail("nạp danh sách thị trường", e); }
  } else {
    selMarket.innerHTML = D.order.map(sl => marketOption(
      { ...D.markets[sl].meta, core: D.markets[sl].core })).join("");
    order = D.order;
  }
  KNOWN = new Set(order);

  const want = decodeURIComponent((location.hash || "").slice(1));
  selMarket.value = KNOWN.has(want) ? want : order[0];
  await setView(want === "tong-quan" ? "overview" : "market", false);

  addEventListener("hashchange", () => {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === "tong-quan") return setView("overview", false);
    if (KNOWN.has(h)) {
      if (h !== selMarket.value) selMarket.value = h;
      setView("market", false);
    }
  });
}
boot();
</script>
